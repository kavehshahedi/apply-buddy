[project]
name = "apply-buddy"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Kaveh Shahedi", email = "kavehshahedi@gmail.com" },
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "sqlmodel==0.0.39",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "linkedin-jobs-scraper==7.0.10",
    "starlette==0.38.6",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.5"
pyright = ">=1.1.411"
pre-commit = ">=4.6.2"
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"

[build-system]
requires = ["poetry-core>=2.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".ruff_cache/", "data/", "chrome-profile/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PIE", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/routers/*.py" = ["B008"]
"app/main.py" = ["E402", "F811", "ARG001", "SIM103"]
"tests/*.py" = ["ARG001", "ARG002", "ARG005"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"